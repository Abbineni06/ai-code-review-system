spring.application.name=CodeReviewer

# ==============================
# Database Configuration
# ==============================

spring.datasource.url=jdbc:mysql://localhost:3306/codereviewer?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# ==============================
# JPA / Hibernate
# ==============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==============================
# Gemini via OpenAI-Compatible API
# ==============================

spring.ai.openai.api-key=${GEMINI_API_KEY}

spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai

spring.ai.openai.chat.options.model=gemini-3.8-flash

# ==============================
# Server
# ==============================

server.port=8080